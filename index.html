<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>About You - The 1975</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #05070c;
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. CANVAS: LONELY STREETLAMP & HEAVY MULTI-LAYER SNOW */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      background: radial-gradient(circle at 45% 45%, #181d28 0%, #0d1017 55%, #040508 100%);
    }

    /* 2. VINTAGE 16MM FILM GRAIN & AMBER VIGNETTE */
    #film-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(10, 15, 25, 0.08) 0%, rgba(3, 4, 7, 0.78) 100%);
      pointer-events: none;
      z-index: 10;
    }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.15;
      pointer-events: none;
      z-index: 11;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.12; }
      50% { opacity: 0.17; }
      100% { opacity: 0.13; }
    }

    .letterbox {
      position: fixed;
      left: 0; width: 100vw;
      height: 4.5vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
    }
    .lb-top { top: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-bottom { bottom: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    /* ==========================================================
       3. CLASSIC SAD SERIF TYPOGRAPHY (CORMORANT GARAMOND)
       ========================================================== */
    #lyric-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding: 0 24px;
    }

    .lyric-box {
      text-align: center;
      max-width: min(90vw, 800px);
      min-height: 85px;
    }

    .lyric-text {
      color: #dbe0ea; /* Faded, sorrowful ash-silver */
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-size: clamp(23px, 3.6vw, 36px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.5;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 
        0 2px 14px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(200, 215, 240, 0.25);
      opacity: 0;
      animation: sadFade 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    @keyframes sadFade {
      0% {
        opacity: 0;
        transform: translateY(6px) scale(0.97);
        filter: blur(3px);
      }
      100% {
        opacity: 0.92;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    /* ==========================================================
       4. 100% UNFAILING START SCREEN (DIRECT TAP SUPPORT)
       ========================================================== */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(4, 6, 10, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      z-index: 999999 !important;
      cursor: pointer;
      pointer-events: auto !important;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    #start-btn {
      width: 100%;
      padding: 18px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #2b3345, #141822);
      color: #e2e8f0;
      border: 1px solid rgba(210, 225, 255, 0.35);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto !important;
    }
    #start-btn:active { transform: scale(0.96); }

    .upload-container {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #94a3b8;
      background: rgba(20, 26, 38, 0.6);
      border: 1px dashed rgba(148, 163, 184, 0.4);
      border-radius: 25px;
      text-align: center;
      overflow: hidden;
    }
    .upload-container input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .subtitle {
      margin-top: 14px;
      opacity: 0.6;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body onclick="startExperience()">

  <!-- Media Player with your uploaded mp4 files -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
    <source src="aboutyou.mp4" type="video/mp4">
    <source src="music.mp4" type="video/mp4">
  </video>

  <div class="letterbox lb-top"></div>
  <div class="letterbox lb-bottom"></div>

  <!-- Canvas Scene: Solitary Victorian Lamppost & Heavy Snow -->
  <canvas id="snow-canvas"></canvas>
  <div id="film-overlay"></div>
  <div id="film-grain"></div>

  <!-- Center Classic Serif Typography -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box"></div>
  </div>

  <!-- Start Screen with direct inline click and touch handlers -->
  <div id="start-screen" onclick="startExperience()">
    <div class="btn-group" onclick="event.stopPropagation()">
      <button id="start-btn" onclick="startExperience()" ontouchend="startExperience()">
        ▶ play winter night
      </button>
      <div class="upload-container">
        <span id="upload-label">📁 or choose video from iPad</span>
        <input type="file" id="media-input" accept="video/*,audio/*" onchange="handleMediaUpload(this)">
      </div>
    </div>
    <p class="subtitle" id="status-text">(tap button or anywhere to start)</p>
  </div>

  <script>
    // ==============================================================
    // 1. FAIL-SAFE START ENGINE (CANNOT FREEZE)
    // ==============================================================
    let hasStarted = false;
    let syncTimer = null;
    let lastRenderedLyric = -1;

    function startExperience() {
      if (hasStarted) return;
      hasStarted = true;

      const screen = document.getElementById('start-screen');
      if (screen) screen.style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio waiting on gesture:", e));

      const clockStart = performance.now();

      // Dual-Sync Clock (Locks to audio time, with timer fallback)
      syncTimer = setInterval(() => {
        let curTime = 0;
        if (!player.paused && player.currentTime > 0) {
          curTime = player.currentTime;
        } else {
          curTime = (performance.now() - clockStart) / 1000;
        }

        updateLyrics(curTime);

        // Seamless Loop every 39.5s
        if (curTime >= 39.5) {
          lastRenderedLyric = -1;
          player.currentTime = 0;
          player.play().catch(() => {});
        }
      }, 30);
    }

    function handleMediaUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const player = document.getElementById('song-player');
        player.src = URL.createObjectURL(file);
        player.load();
        document.getElementById('upload-label').innerText = "✓ video connected!";
        document.getElementById('status-text').innerText = "ready! tap play now.";
      }
    }

    // ==============================================================
    // 2. TIMED LYRICS ("ABOUT YOU" - THE 1975)
    // ==============================================================
    const TIMED_LYRICS = [
      { time: 0.2,  text: "we get married" },
      { time: 2.4,  text: "we get married" },
      { time: 4.8,  text: "we get married in our heads" },
      { time: 10.4, text: "something to do while we try to recall how we met" },
      { time: 20.2, text: "do you think i have forgotten?" },
      { time: 25.2, text: "do you think i have forgotten?" },
      { time: 30.2, text: "do you think i have forgotten" },
      { time: 35.2, text: "do you think i have forgotten about you?" }
    ];

    function updateLyrics(time) {
      const box = document.getElementById('lyric-box');
      let activeIndex = -1;
      for (let i = 0; i < TIMED_LYRICS.length; i++) {
        if (time >= TIMED_LYRICS[i].time) {
          activeIndex = i;
        }
      }

      if (activeIndex !== -1 && activeIndex !== lastRenderedLyric) {
        lastRenderedLyric = activeIndex;
        box.innerHTML = `<div class="lyric-text">${TIMED_LYRICS[activeIndex].text}</div>`;
      }
    }

    // ==============================================================
    // 3. CANVAS: SAD WINTER NIGHT & HEAVY FALLING SNOW
    // ==============================================================
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let bokehs = [];
    let snowflakes = [];
    let foregroundBokehFlakes = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    }

    function initScene() {
      // Lonely streetlamp bokeh
      bokehs = [];
      const colors = ['rgba(235, 185, 120, ', 'rgba(180, 195, 220, ', 'rgba(210, 160, 90, '];
      for (let i = 0; i < 16; i++) {
        bokehs.push({
          x: Math.random() * width,
          y: height * 0.35 + Math.random() * (height * 0.55),
          r: Math.random() * 50 + 22,
          c: colors[Math.floor(Math.random() * colors.length)],
          a: Math.random() * 0.18 + 0.08,
          dx: (Math.random() - 0.5) * 0.2,
          p: Math.random() * Math.PI
        });
      }

      // Slow sorrowful snowfall
      snowflakes = [];
      for (let i = 0; i < Math.floor(width * 0.3); i++) {
        snowflakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.4 + 0.8,
          s: Math.random() * 1.2 + 0.8,
          w: Math.random() * 0.6 - 0.15,
          a: Math.random() * 0.6 + 0.25,
          sw: Math.random() * Math.PI
        });
      }

      // Huge blurry foreground bokeh flakes
      foregroundBokehFlakes = [];
      for (let i = 0; i < 14; i++) {
        foregroundBokehFlakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 24 + 14,
          s: Math.random() * 2.4 + 1.6,
          w: Math.random() * 0.9 + 0.2,
          a: Math.random() * 0.28 + 0.12
        });
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, width, height);

      // Lamppost light cone
      const lampX = width * 0.25;
      const lampGrad = ctx.createRadialGradient(lampX, height * 0.35, 10, lampX, height * 0.55, 240);
      lampGrad.addColorStop(0, 'rgba(255, 215, 140, 0.28)');
      lampGrad.addColorStop(1, 'rgba(255, 215, 140, 0)');
      ctx.fillStyle = lampGrad;
      ctx.fillRect(lampX - 250, height * 0.2, 500, height * 0.8);

      // Lamppost Silhouette
      ctx.fillStyle = '#030406';
      ctx.fillRect(lampX - 3, height * 0.35, 6, height * 0.65);
      ctx.fillRect(lampX - 14, height * 0.33, 28, 12);

      // Soft bokeh
      bokehs.forEach(b => {
        b.x += b.dx;
        b.p += 0.012;
        const alpha = b.a + Math.sin(b.p) * 0.04;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, b.c + alpha + ')');
        grad.addColorStop(1, b.c + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b.x < -b.r) b.x = width + b.r;
        if (b.x > width + b.r) b.x = -b.r;
      });

      // Regular Snow
      snowflakes.forEach(s => {
        s.sw += 0.018;
        s.y += s.s;
        s.x += s.w + Math.sin(s.sw) * 0.35;
        ctx.fillStyle = `rgba(220, 230, 245, ${s.a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        if (s.y > height) { s.y = -s.r; s.x = Math.random() * width; }
      });

      // Foreground Bokeh Flakes
      foregroundBokehFlakes.forEach(f => {
        f.y += f.s;
        f.x += f.w;
        const grad = ctx.createRadialGradient(f.x, f.y, f.r * 0.2, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(240, 245, 255, ${f.a})`);
        grad.addColorStop(0.7, `rgba(220, 230, 245, ${f.a * 0.5})`);
        grad.addColorStop(1, 'rgba(220, 230, 245, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        if (f.y > height + f.r) { f.y = -f.r; f.x = Math.random() * width; }
      });

      requestAnimationFrame(drawScene);
    }

    window.addEventListener('resize', resize);
    resize();
    drawScene();
  </script>
</body>
</html>
