<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>About You - The 1975</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0704;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================
       1. CHANGING WINTER BACKGROUND SCENES (SMOOTH CROSSFADES)
       ========================================================== */
    .scene-layer {
      position: fixed;
      inset: 0;
      opacity: 0;
      transition: opacity 1.6s ease-in-out;
      z-index: 1;
      pointer-events: none;
    }
    .scene-layer.active {
      opacity: 1;
    }

    /* Scene 1: Amber Streetlamp & Bare Trees (0:00 - 0:08) */
    #scene-1 {
      background: radial-gradient(circle at 60% 70%, #3a2210 0%, #170e06 60%, #080502 100%);
    }

    /* Scene 2: Pine Tree in Deep Snow (0:08 - 0:19) */
    #scene-2 {
      background: radial-gradient(circle at 35% 55%, #2a1c0e 0%, #120d07 55%, #060402 100%);
    }

    /* Scene 3: Snowy Sidewalk Night Walk (0:19 - 0:21) */
    #scene-3 {
      background: radial-gradient(circle at 50% 45%, #23160a 0%, #0d0904 60%, #040301 100%);
    }

    /* Scene 4: Cozy Window with Stars & Warm Room Lamp (0:21 - 0:34) */
    #scene-4 {
      background: radial-gradient(circle at 50% 40%, #4a2c14 0%, #1f1106 50%, #0a0502 100%);
    }

    /* Scene 5: City Street Wrapped in Fairy Lights (0:35 - 0:39) */
    #scene-5 {
      background: radial-gradient(circle at 45% 60%, #3e2612 0%, #1a1006 55%, #070402 100%);
    }

    /* Background Silhouette Elements (SVG) */
    .scene-svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 2. MULTI-LAYER FALLING SNOW CANVAS */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100vw; height: 100vh;
      z-index: 5;
      pointer-events: none;
    }

    /* 3. VINTAGE GRAIN & AMBER VIGNETTE */
    #film-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 175, 75, 0.08) 0%, rgba(15, 8, 3, 0.65) 100%);
      pointer-events: none;
      z-index: 10;
    }

    #film-grain {
      position: fixed;
      inset: 0;
      opacity: 0.14;
      pointer-events: none;
      z-index: 11;
      background-image: repeating-radial-gradient(circle, #fff 0, transparent 1px, transparent 4px);
      background-size: 5px 5px;
      animation: grainFlicker 0.15s infinite;
    }
    @keyframes grainFlicker {
      0% { opacity: 0.12; }
      50% { opacity: 0.17; }
      100% { opacity: 0.13; }
    }

    /* 4. CENTERED MINIMALIST TYPOGRAPHY */
    #lyric-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding: 0 24px;
    }

    .lyric-box {
      text-align: center;
      max-width: min(90vw, 750px);
      min-height: 80px;
    }

    .lyric-text {
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: clamp(20px, 3.2vw, 32px);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
      text-align: center;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: scale(0.97);
      animation: lyricFade 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    @keyframes lyricFade {
      0% { opacity: 0; transform: scale(0.96) translateY(4px); }
      100% { opacity: 0.96; transform: scale(1) translateY(0); }
    }

    /* 5. START OVERLAY */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(14, 10, 6, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff4e6;
      z-index: 99999 !important;
      pointer-events: auto !important;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    #start-btn {
      width: 100%;
      padding: 18px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 500;
      background: linear-gradient(135deg, #e6a86c, #c97d3b);
      color: #1a0f05;
      border: 1px solid rgba(255, 235, 210, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(230, 168, 108, 0.45);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    #start-btn:active { transform: scale(0.96); }

    .upload-container {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      font-size: 13.5px;
      color: #d1b89d;
      background: rgba(45, 30, 18, 0.6);
      border: 1px dashed rgba(230, 168, 108, 0.5);
      border-radius: 25px;
      text-align: center;
      overflow: hidden;
    }
    .upload-container input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .subtitle {
      margin-top: 14px;
      opacity: 0.65;
      font-size: 13.5px;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Media Player: Plays aboutyou.mp4 or video uploaded to repo -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto">
    <source src="aboutyou.mp4" type="video/mp4">
    <source src="winter.mp4" type="video/mp4">
    <source src="snaptik_7635591509277986068_v3.mp4" type="video/mp4">
  </video>

  <!-- ============================================================== -->
  <!-- 5 CHANGING COZY WINTER SCENES (CROSSFADES WITH THE SONG)       -->
  <!-- ============================================================== -->
  <!-- Scene 1: Amber Streetlamp & Bare Trees (0:00 - 0:08) -->
  <div class="scene-layer active" id="scene-1">
    <svg class="scene-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <!-- Bare tree silhouette -->
      <path d="M 220,600 C 230,420 240,300 250,220 C 260,180 280,120 320,60 M 250,220 C 220,180 180,130 140,80 M 240,300 C 190,260 160,200 120,160" stroke="#060402" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="620" cy="420" rx="400" ry="80" fill="#1b120a" opacity="0.6"/>
    </svg>
  </div>

  <!-- Scene 2: Pine Tree in Deep Snow (0:08 - 0:19) -->
  <div class="scene-layer" id="scene-2">
    <svg class="scene-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <!-- Pine tree covered in snow -->
      <path d="M 180,550 L 260,550 L 260,600 L 180,600 Z M 220,100 L 120,240 L 160,240 L 90,360 L 140,360 L 60,500 L 380,500 L 300,360 L 350,360 L 280,240 L 320,240 Z" fill="#050302"/>
      <ellipse cx="220" cy="520" rx="220" ry="40" fill="#1a1107" opacity="0.7"/>
    </svg>
  </div>

  <!-- Scene 3: Snowy Sidewalk Night Walk (0:19 - 0:21) -->
  <div class="scene-layer" id="scene-3">
    <svg class="scene-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <!-- Snowy road & two silhouettes walking -->
      <path d="M 0,600 L 400,280 L 600,280 L 1000,600 Z" fill="#130c05"/>
      <circle cx="490" cy="380" r="12" fill="#040201"/>
      <path d="M 478,392 L 502,392 L 506,450 L 474,450 Z" fill="#040201"/>
      <circle cx="518" cy="385" r="11" fill="#040201"/>
      <path d="M 508,396 L 528,396 L 532,450 L 504,450 Z" fill="#040201"/>
    </svg>
  </div>

  <!-- Scene 4: Cozy Window with Stars & Warm Room Lamp (0:21 - 0:34) -->
  <div class="scene-layer" id="scene-4">
    <svg class="scene-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <!-- Window frame -->
      <rect x="250" y="60" width="500" height="480" rx="8" fill="none" stroke="#080502" stroke-width="24"/>
      <line x1="500" y1="60" x2="500" y2="540" stroke="#080502" stroke-width="16"/>
      <line x1="250" y1="220" x2="750" y2="220" stroke="#080502" stroke-width="12"/>
      <line x1="250" y1="380" x2="750" y2="380" stroke="#080502" stroke-width="12"/>
      <!-- Paper star stickers on window glass -->
      <polygon points="370,120 376,138 395,138 380,149 385,167 370,156 355,167 360,149 345,138 364,138" fill="#ffd599" opacity="0.85"/>
      <polygon points="630,280 635,295 650,295 638,304 642,318 630,309 618,318 622,304 610,295 625,295" fill="#ffd599" opacity="0.85"/>
      <polygon points="350,440 355,455 370,455 358,464 362,478 350,469 338,478 342,464 330,455 345,455" fill="#ffd599" opacity="0.85"/>
    </svg>
  </div>

  <!-- Scene 5: City Street Wrapped in Fairy Lights (0:35 - 0:39) -->
  <div class="scene-layer" id="scene-5">
    <svg class="scene-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <!-- Trees with glowing fairy string lights -->
      <path d="M 150,600 L 170,250 M 850,600 L 830,250" stroke="#060301" stroke-width="18"/>
      <!-- Sparkling fairy dots -->
      <circle cx="160" cy="320" r="4" fill="#ffe099" filter="drop-shadow(0 0 6px #ffb347)"/>
      <circle cx="190" cy="280" r="3.5" fill="#ffe099" filter="drop-shadow(0 0 6px #ffb347)"/>
      <circle cx="140" cy="240" r="4" fill="#ffe099" filter="drop-shadow(0 0 6px #ffb347)"/>
      <circle cx="840" cy="310" r="4" fill="#ffe099" filter="drop-shadow(0 0 6px #ffb347)"/>
      <circle cx="810" cy="270" r="3.5" fill="#ffe099" filter="drop-shadow(0 0 6px #ffb347)"/>
      <circle cx="860" cy="230" r="4" fill="#ffe099" filter="drop-shadow(0 0 6px #ffb347)"/>
    </svg>
  </div>

  <!-- Snow Canvas -->
  <canvas id="snow-canvas"></canvas>
  <div id="film-overlay"></div>
  <div id="film-grain"></div>

  <!-- Minimalist Typography -->
  <div id="lyric-container">
    <div class="lyric-box" id="lyric-box"></div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="btn-group">
      <button id="start-btn">▶ play winter night</button>
      
      <!-- Pick video from iPad if not yet uploaded to GitHub -->
      <div class="upload-container">
        <span id="upload-label">📁 ជ្រើសរើសវីដេអូពី iPad</span>
        <input type="file" id="media-input" accept="video/*,audio/*" onchange="handleMediaUpload(this)">
      </div>
    </div>
    <p class="subtitle" id="status-text">(opens with music & changing winter scenes)</p>
  </div>

  <script>
    // ==============================================================
    // 1. CANVAS: WARM GOLDEN AMBIENCE & HEAVY MULTI-LAYER SNOW
    // ==============================================================
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let bokehs = [];
    let snowflakes = [];
    let foregroundBokehFlakes = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    }

    function initScene() {
      bokehs = [];
      const bokehColors = ['rgba(255, 195, 110, ', 'rgba(255, 150, 60, ', 'rgba(255, 220, 160, '];
      for (let i = 0; i < 22; i++) {
        bokehs.push({
          x: Math.random() * width,
          y: height * 0.35 + Math.random() * (height * 0.55),
          r: Math.random() * 55 + 25,
          color: bokehColors[Math.floor(Math.random() * bokehColors.length)],
          alpha: Math.random() * 0.28 + 0.12,
          drift: (Math.random() - 0.5) * 0.25,
          pulse: Math.random() * Math.PI
        });
      }

      snowflakes = [];
      for (let i = 0; i < Math.floor(width * 0.35); i++) {
        snowflakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.8 + 1.0,
          speed: Math.random() * 1.8 + 1.2,
          wind: Math.random() * 0.8 - 0.2,
          alpha: Math.random() * 0.7 + 0.3,
          swing: Math.random() * Math.PI
        });
      }

      // Large blurry foreground bokeh flakes
      foregroundBokehFlakes = [];
      for (let i = 0; i < 16; i++) {
        foregroundBokehFlakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 26 + 14,
          speed: Math.random() * 3.5 + 2.5,
          wind: Math.random() * 1.2 + 0.3,
          alpha: Math.random() * 0.35 + 0.15
        });
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, width, height);

      // Bokeh lights
      bokehs.forEach(b => {
        b.x += b.drift;
        b.pulse += 0.015;
        const currentAlpha = b.alpha + Math.sin(b.pulse) * 0.06;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, b.color + currentAlpha + ')');
        grad.addColorStop(1, b.color + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        if (b.x < -b.r) b.x = width + b.r;
        if (b.x > width + b.r) b.x = -b.r;
      });

      // Regular snow
      snowflakes.forEach(s => {
        s.swing += 0.02;
        s.y += s.speed;
        s.x += s.wind + Math.sin(s.swing) * 0.4;

        ctx.fillStyle = `rgba(255, 250, 240, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        if (s.y > height) { s.y = -s.r; s.x = Math.random() * width; }
      });

      // Large foreground bokeh flakes
      foregroundBokehFlakes.forEach(f => {
        f.y += f.speed;
        f.x += f.wind;
        const grad = ctx.createRadialGradient(f.x, f.y, f.r * 0.2, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(255, 255, 255, ${f.alpha})`);
        grad.addColorStop(0.7, `rgba(255, 245, 230, ${f.alpha * 0.6})`);
        grad.addColorStop(1, 'rgba(255, 245, 230, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();

        if (f.y > height + f.r) { f.y = -f.r; f.x = Math.random() * width; }
      });

      requestAnimationFrame(drawScene);
    }

    window.addEventListener('resize', resize);
    resize();
    drawScene();

    // ==============================================================
    // 2. TIMED BACKGROUND SCENE SHIFTS (MATCHED TO VIDEO CUTS)
    // ==============================================================
    const SCENE_CUES = [
      { time: 0.0,  id: 'scene-1' }, // Bare Trees & Amber Streetlamp
      { time: 8.5,  id: 'scene-2' }, // Pine Tree in Deep Snow
      { time: 19.0, id: 'scene-3' }, // Snowy Sidewalk Night Walk
      { time: 21.0, id: 'scene-4' }, // Cozy Window with Stars & Lamp
      { time: 35.0, id: 'scene-5' }  // City Street with Fairy Lights
    ];

    // ==============================================================
    // 3. TIMED LYRICS ("ABOUT YOU" - THE 1975)
    // ==============================================================
    const TIMED_LYRICS = [
      { time: 0.1,  text: "we get married" },
      { time: 2.2,  text: "we get married" },
      { time: 4.8,  text: "we get married in our heads" },
      { time: 10.4, text: "something to do while we try to recall how we met" },
      { time: 20.2, text: "do you think i have forgotten?" },
      { time: 25.2, text: "do you think i have forgotten?" },
      { time: 30.2, text: "do you think i have forgotten" },
      { time: 35.2, text: "do you think i have forgotten about you?" }
    ];

    let hasStarted = false;
    let syncTimer = null;
    let lastRenderedLyric = -1;
    let lastActiveScene = null;

    function handleMediaUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const player = document.getElementById('song-player');
        player.src = URL.createObjectURL(file);
        player.load();
        document.getElementById('upload-label').innerText = "✓ video connected!";
        document.getElementById('status-text').innerText = "ready! tap 'play winter night' now.";
      }
    }

    function startExperience() {
      if (hasStarted) return;
      hasStarted = true;

      document.getElementById('start-screen').style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play:", e));

      const clockStart = performance.now();

      // Real-time audio sync loop (30ms frequency)
      syncTimer = setInterval(() => {
        let curTime = 0;
        if (!player.paused && player.currentTime > 0) {
          curTime = player.currentTime;
        } else {
          curTime = (performance.now() - clockStart) / 1000;
        }

        // 1. Shift Background Scenes with the Song Cuts
        updateBackgroundScene(curTime);

        // 2. Display Lyrics in Sync
        updateLyrics(curTime);

        // Seamless Loop every 39.5s
        if (curTime >= 39.5) {
          lastRenderedLyric = -1;
          lastActiveScene = null;
          player.currentTime = 0;
          player.play().catch(() => {});
        }
      }, 30);
    }

    function updateBackgroundScene(time) {
      let targetScene = SCENE_CUES[0].id;
      for (let i = 0; i < SCENE_CUES.length; i++) {
        if (time >= SCENE_CUES[i].time) {
          targetScene = SCENE_CUES[i].id;
        }
      }

      if (targetScene !== lastActiveScene) {
        lastActiveScene = targetScene;
        document.querySelectorAll('.scene-layer').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(targetScene);
        if (activeEl) activeEl.classList.add('active');
      }
    }

    function updateLyrics(time) {
      const box = document.getElementById('lyric-box');
      let activeIndex = -1;
      for (let i = 0; i < TIMED_LYRICS.length; i++) {
        if (time >= TIMED_LYRICS[i].time) {
          activeIndex = i;
        }
      }

      if (activeIndex !== -1 && activeIndex !== lastRenderedLyric) {
        lastRenderedLyric = activeIndex;
        box.innerHTML = `<div class="lyric-text">${TIMED_LYRICS[activeIndex].text}</div>`;
      }
    }

    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startExperience);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startExperience();
    });
  </script>
</body>
  </html>
